name: Fast Translator Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryni yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tizim paketlarini o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Python kutubxonalarini o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python main.py
